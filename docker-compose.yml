services:
  creditmanager:
    build: .
    image: creditmanager:latest
    container_name: creditmanager
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATA_DIR=/data
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      # Carpeta del dispositivo donde se guardará tarjetas.db
      # Se puede personalizar con la variable DATA_PATH en un archivo .env o en el entorno
      - ${DATA_PATH:-./data}:/data

